name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Gradle 8.14 itself needs a modern JDK; the build's toolchains then pick
    # JDK 21 to compile and JDK 8 to fork the Robolectric tests.
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

    steps:
      - uses: actions/checkout@v4

      # This project deliberately avoids the Android Gradle Plugin and Google's
      # SDK downloads, building the APK from the Debian-packaged AOSP tools
      # instead (aapt -> dalvik-exchange -> zipalign -> apksigner). Install the
      # exact same toolchain the build script expects, plus both JDKs.
      - name: Install JDK 8 + 21 and offline AOSP build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-8-jdk-headless openjdk-21-jdk-headless \
            aapt zipalign apksigner dalvik-exchange libandroid-23-java

      # No Gradle wrapper is committed, so provision the pinned version here.
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit + Robolectric tests
        run: gradle test --no-daemon --stacktrace

      - name: Assemble signed debug APK
        run: gradle :app:assembleApk --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: recoverwell-debug-apk
          path: app/build/apk/recoverwell-debug.apk
          if-no-files-found: error

      # Keep the HTML/XML reports when something fails, for quick triage.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
